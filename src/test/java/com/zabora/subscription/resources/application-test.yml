spring:
  application:
    name: zabora-subscription-service-test

  datasource:
    url: jdbc:tc:mysql:8.0:///test_subscriptions
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true  
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  sql:
    init:
      mode: always

  cloud:
    consul:
      enabled: false