# =============================================================================
# Zabora Subscription Service — configuración por ENTORNO (sin secretos en repo)
# Define variables en el sistema, .env cargado por tu IDE, Docker o systemd.
# Ver: .env.example y application-example.yml
# Desarrollo local opcional: application-local.yml (gitignored) con overrides.
# =============================================================================

spring:
  application:
    name: zabora-subscription-service

  cloud:
    consul:
      enabled: true
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        prefer-ip-address: true
        service-name: zabora-subscription-service
        health-check-path: /actuator/health
        health-check-interval: 10s
      config:
        enabled: false

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/zabora_subscriptions?sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Bogota

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

server:
  port: ${PORT:8004}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  public-key: ${MP_PUBLIC_KEY:}
  environment: ${MP_ENVIRONMENT:test}
  webhook:
    secret: ${MP_WEBHOOK_SECRET:}
    notification-url: ${MP_WEBHOOK_NOTIFICATION_URL:https://tu-dominio/api/webhooks/mercadopago}
  success-url: ${MP_SUCCESS_URL:http://localhost:4200/suscripciones/exito}
  failure-url: ${MP_FAILURE_URL:http://localhost:4200/suscripciones/checkout?payment=failure}
  pending-url: ${MP_PENDING_URL:http://localhost:4200/suscripciones/checkout?payment=pending}

email:
  enabled: ${EMAIL_ENABLED:false}
  from: ${EMAIL_FROM:noreply@example.com}
  send-factura: ${EMAIL_SEND_FACTURA:true}
  admin-notifications-enabled: ${EMAIL_ADMIN_NOTIFY:false}
  admin-recipients: ${EMAIL_ADMIN_RECIPIENTS:}

zabora:
  subscription:
    jwt:
      secret: ${JWT_SECRET:}

feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 30000
        loggerLevel: ${FEIGN_LOGGER_LEVEL:FULL}
      auth-service:
        connectTimeout: 10000
        readTimeout: 30000
        loggerLevel: ${FEIGN_LOGGER_LEVEL:FULL}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.zabora.subscription: ${LOG_LEVEL_SUBSCRIPTION:INFO}
    org.springframework.web: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    feign: ${LOG_LEVEL_FEIGN:INFO}
    org.springframework.cloud.openfeign: ${LOG_LEVEL_FEIGN:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      mail:
        enabled: false

app:
  mode: ${APP_MODE:development}
