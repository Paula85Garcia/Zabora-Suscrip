      port: 8500
      discovery:
        prefer-ip-address: true
      config:
        enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/zabora_subscriptions?sslMode=REQUIRED&allowPublicKeyRetrieval=true
    username: root
    password: Yulia280719**
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Bogota

  mail:
    host: smtp.gmail.com
    port: 587
    username: zaborapayment@gmail.com
    password: pvrbddmghsgktvfe
