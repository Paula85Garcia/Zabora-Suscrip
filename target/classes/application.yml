# ========================================
# ZABORA - CONFIGURACIÓN SUSCRIPCIONES
# ========================================
spring:
  application:
    name: zabora-subscription-service

  cloud:
    consul:
      enabled: true
      host: localhost
      port: 8500
      discovery:
        prefer-ip-address: true
        service-name: zabora-subscription-service
        health-check-path: /actuator/health
        health-check-interval: 10s
      config:
        enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/zabora_subscriptions?sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: root
    password: Pau2003mich.
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Bogota

  mail:
    host: smtp.gmail.com
    port: 587
    username: zaborapayment@gmail.com
    password: pvrbddmghsgktvfe
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

server:
  port: 8004
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

