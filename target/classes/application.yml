  pending-url: http://localhost:4200/suscripciones/checkout?payment=pending

# Email configuration
email:
  enabled: true
  from: zaborapayment@gmail.com

# Swagger/OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Logging
logging:
  level:
    root: INFO
    com.zabora.subscription: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    com.mercadopago: DEBUG
    com.zabora.subscription.repository.AuthClient: DEBUG
    feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      mail:
        enabled: false  # Deshabilitar health check de mail para evitar warnings

app:
  mode: development

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 30000
        loggerLevel: full
      auth-service:
        connectTimeout: 10000
        readTimeout: 30000
        loggerLevel: full